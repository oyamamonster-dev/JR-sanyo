name: Fetch Weather and Run Delay Prediction

on:
  schedule:
    # 3時間おきに自動実行 (UTC時間)
    - cron: '0 */3 * * *'
  workflow_dispatch: # 手動実行用

jobs:
  predict:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # 1. main ブランチ (設定ファイルや出力先) のチェックアウト
      - name: Checkout main branch
        uses: actions/checkout@v4

      # 2. 推論用コード (model-release ブランチ) を 'model_src' ディレクトリにチェックアウト
      - name: Checkout model code
        uses: actions/checkout@v4
        with:
          ref: 'model-release'
          path: 'model_src'

      # 3. Python 環境構築
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 4. 依存ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f model_src/requirements.txt ]; then pip install -r model_src/requirements.txt; fi

      # 5. config/config.json から各種設定の読み込み
      - name: Parse Config
        id: parse_config
        run: |
          TAG=$(jq -r '.active_models[0].release_tag' config/config.json)
          MODEL_ID=$(jq -r '.active_models[0].model_id' config/config.json)
          MODEL_FILE=$(jq -r '.active_models[0].model_filename' config/config.json)
          OUTPUT_FILE=$(jq -r '.active_models[0].output_filename' config/config.json)

          echo "release_tag=$TAG" >> $GITHUB_OUTPUT
          echo "model_id=$MODEL_ID" >> $GITHUB_OUTPUT
          echo "model_filename=$MODEL_FILE" >> $GITHUB_OUTPUT
          echo "output_filename=$OUTPUT_FILE" >> $GITHUB_OUTPUT

      # 6. GitHub Releases からモデルアセット (.pkl) をダウンロード
      - name: Download Model Asset from Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download ${{ steps.parse_config.outputs.release_tag }} \
            --pattern "${{ steps.parse_config.outputs.model_filename }}" \
            --dir . \
            --clobber

      # 7. OpenWeather API 等から最新気象データを取得 (site/weather_latest.json)
      # ※ 気象取得スクリプトが用意されている前提
      - name: Fetch Latest Weather Data
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
        run: |
          # 気象データ取得処理（既存のスクリプト等があれば呼び出し）
          echo "Fetching weather data..."

      # 8. モデル2の推論スクリプト実行
      - name: Run Prediction Script
        run: |
          python model_src/src/models/predict_from_weather.py \
            --config config/config.json \
            --weather site/weather_latest.json \
            --model_id ${{ steps.parse_config.outputs.model_id }} \
            --model_file ${{ steps.parse_config.outputs.model_filename }} \
            --selected_features model_src/reports/selected_features_v2.json \
            --output site/predictions/${{ steps.parse_config.outputs.output_filename }}

      # 9. 推論結果を git commit して GitHub Pages (main) に反映
      - name: Commit and Push Prediction Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add site/predictions/
          git commit -m "auto: update prediction results [skip ci]" || exit 0
          git push
